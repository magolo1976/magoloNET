<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartera de Acciones</title>
    <!-- Fuente de Google para que se vea moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Contenedor de las tarjetas */
        #stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }

        /* Diseño de la tarjeta */
        .stock-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .stock-card:hover {
            transform: translateY(-2px);
        }

        .ticker-group {
            display: flex;
            flex-direction: column;
        }

        .ticker-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .ticker-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 4px;
        }

        .price-group {
            text-align: right;
        }

        .price-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            font-feature-settings: "tnum"; /* Números alineados */
        }

        .last-update {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Estados de carga y error */
        .state-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        .error-msg {
            color: #ef4444;
            background: #fee2e2;
            border-color: #fca5a5;
        }

        /* Animación suave de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .stock-card {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body>

    <header>
        <h1>BKI Portafolio</h1>
        <p class="subtitle" id="header-date">Actualización diaria automática (9:00 AM)</p>
    </header>

    <div id="stock-grid">
        <div class="state-msg">Cargando datos del mercado...</div>
    </div>

    <script>
        // URL DE TU GOOGLE SHEET (PUBLICADA COMO CSV)
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsnmjygWG6TxoCh01ThLVM5YDD5NOQnMkBgMHxVqc9MF8d2fn1J7LCUyItMoZ-BoGfL5iU0Dw2yLWR/pub?gid=1627775802&single=true&output=csv";

        document.addEventListener("DOMContentLoaded", () => {
            fetchData();
        });

        async function fetchData() {
            const container = document.getElementById('stock-grid');
            
            try {
                // 1. Obtener los datos crudos
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("No se pudo conectar con Google Sheets");
                
                const textData = await response.text();
                
                // 2. Parsear CSV (manejo básico de comillas y saltos de línea)
                const rows = textData.split('\n').map(row => row.split(','));

                // Validaciones iniciales
                if (rows.length < 2) {
                    container.innerHTML = '<div class="state-msg">La hoja de datos está vacía o inicializando.</div>';
                    return;
                }

                // 3. Analizar cabeceras (Fila 0)
                const headers = rows[0];
                const lastColIndex = headers.length - 1;
                
                // Limpiamos comillas que a veces añade el CSV
                const cleanText = (txt) => txt ? txt.replace(/"/g, '').trim() : "";
                
                // Fecha de la última columna
                const lastDate = cleanText(headers[lastColIndex]);
                
                // Actualizar subtítulo con la fecha real
                if (lastDate && lastDate !== "Estado") {
                    document.getElementById('header-date').textContent = `Últimos datos: ${lastDate}`;
                }

                container.innerHTML = ''; // Limpiar mensaje de carga

                // 4. Procesar filas de datos (Desde fila 1)
                let activeCount = 0;

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    
                    // Si la fila está rota o vacía, saltar
                    if (row.length <= 1) continue;

                    // Extraer datos clave
                    const ticker = cleanText(row[0]);         // Columna A
                    const estado = cleanText(row[1]);         // Columna B (0 o 1)
                    const rawPrice = cleanText(row[lastColIndex]); // Última columna

                    // --- FILTRO CRÍTICO ---
                    // Solo mostramos si Estado es "1"
                    if (estado !== "1") {
                        continue;
                    }

                    activeCount++;

                    // Formatear precio
                    let displayPrice = "---";
                    if (rawPrice && !isNaN(parseFloat(rawPrice))) {
                        displayPrice = `$${parseFloat(rawPrice).toFixed(2)}`;
                    } else if (rawPrice === "#N/A") {
                        displayPrice = "Error";
                    } else {
                        displayPrice = rawPrice || "---";
                    }

                    // Crear tarjeta HTML
                    const card = document.createElement('div');
                    card.className = 'stock-card';
                    // Retraso escalonado para la animación
                    card.style.animationDelay = `${activeCount * 0.05}s`; 
                    
                    card.innerHTML = `
                        <div class="ticker-group">
                            <div class="ticker-name">${ticker}</div>
                            <div class="ticker-label">Stock</div>
                        </div>
                        <div class="price-group">
                            <div class="price-value">${displayPrice}</div>
                            <div class="last-update">${lastDate}</div>
                        </div>
                    `;
                    container.appendChild(card);
                }

                if (activeCount === 0) {
                    container.innerHTML = '<div class="state-msg">No hay acciones activas configuradas.<br>Revisa la hoja "Config".</div>';
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="state-msg error-msg">Error al cargar datos:<br>${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
