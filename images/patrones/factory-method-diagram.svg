<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Definiciones -->
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombras -->
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Flechas -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="white" />
    </marker>
    
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
  </defs>
  
  <!-- Fondo -->
  <rect width="1000" height="700" fill="url(#bgGradient)"/>
  
  <!-- Título -->
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">
    Factory Method Pattern
  </text>
  <text x="500" y="80" font-family="Arial, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle">
    Delega la creación de objetos a las subclases
  </text>
  
  <!-- Creator Base -->
  <g filter="url(#shadow)">
    <rect x="350" y="120" width="300" height="120" rx="10" fill="#7c3aed" stroke="#a78bfa" stroke-width="3"/>
    <text x="500" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      Logistica
    </text>
    <text x="500" y="170" font-family="Arial, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">
      (Clase Abstracta)
    </text>
    <line x1="365" y1="180" x2="635" y2="180" stroke="#c4b5fd" stroke-width="2"/>
    
    <!-- Factory Method destacado -->
    <rect x="370" y="190" width="260" height="30" rx="5" fill="#f59e0b" opacity="0.9"/>
    <text x="500" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">
      CrearTransporte() ⚡
    </text>
  </g>
  
  <!-- Flechas herencia -->
  <line x1="400" y1="240" x2="250" y2="330" stroke="white" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="600" y1="240" x2="750" y2="330" stroke="white" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  
  <!-- Concrete Creators -->
  <g filter="url(#shadow)">
    <rect x="100" y="330" width="300" height="100" rx="10" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
    <text x="250" y="360" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      LogisticaTerrestre
    </text>
    <line x1="115" y1="370" x2="385" y2="370" stroke="#fef3c7" stroke-width="1.5"/>
    <text x="250" y="395" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">
      CrearTransporte()
    </text>
    <text x="250" y="415" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle" font-weight="bold">
      return new Camion();
    </text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="600" y="330" width="300" height="100" rx="10" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
    <text x="750" y="360" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      LogisticaMaritima
    </text>
    <line x1="615" y1="370" x2="885" y2="370" stroke="#fef3c7" stroke-width="1.5"/>
    <text x="750" y="395" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">
      CrearTransporte()
    </text>
    <text x="750" y="415" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle" font-weight="bold">
      return new Barco();
    </text>
  </g>
  
  <!-- Flechas de creación -->
  <line x1="250" y1="430" x2="250" y2="500" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  <line x1="750" y1="430" x2="750" y2="500" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  
  <text x="280" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">
    crea
  </text>
  <text x="780" y="465" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">
    crea
  </text>
  
  <!-- Products -->
  <g filter="url(#shadow)">
    <rect x="150" y="500" width="200" height="80" rx="10" fill="#10b981" stroke="#6ee7b7" stroke-width="3"/>
    <text x="250" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      Camion
    </text>
    <line x1="165" y1="540" x2="335" y2="540" stroke="#d1fae5" stroke-width="1.5"/>
    <text x="250" y="560" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">
      Entregar()
    </text>
    <text x="250" y="575" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">
      "📦 Por tierra"
    </text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="650" y="500" width="200" height="80" rx="10" fill="#10b981" stroke="#6ee7b7" stroke-width="3"/>
    <text x="750" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      Barco
    </text>
    <line x1="665" y1="540" x2="835" y2="540" stroke="#d1fae5" stroke-width="1.5"/>
    <text x="750" y="560" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">
      Entregar()
    </text>
    <text x="750" y="575" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">
      "🚢 Por mar"
    </text>
  </g>
  
  <!-- Explicación -->
  <g filter="url(#shadow)">
    <rect x="50" y="620" width="900" height="60" rx="10" fill="rgba(0,0,0,0.6)" stroke="#60a5fa" stroke-width="2"/>
    <text x="500" y="645" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">
      ⚡ La Clave: Cada subclase decide QUÉ producto crear
    </text>
    <text x="500" y="665" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      El cliente usa Logistica sin saber si es Terrestre o Marítima
    </text>
  </g>
</svg>