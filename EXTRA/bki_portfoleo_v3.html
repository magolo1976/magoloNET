<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Optimizer - Markowitz v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b;
            --accent: #3b82f6; --success: #10b981; --border: #e2e8f0;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; }
        .header { text-align: center; margin-bottom: 30px; }
        
        /* Panel de Control */
        .controls { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 600; font-size: 0.9rem; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; }
        
        .btn-optimize { grid-column: 1 / -1; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-optimize:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Resultados */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .stock-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; animation: slideUp 0.4s ease-out forwards; }
        .summary-card { background: #1e293b; color: white; padding: 25px; border-radius: 16px; margin-top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
        .chart-card { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-top: 16px; }
        .chart-title { margin: 0 0 10px 0; font-size: 0.95rem; font-weight: 700; }
        
        .ticker { font-weight: 800; font-size: 1.2rem; color: var(--accent); }
        .qty { font-size: 0.85rem; color: #64748b; }
        .price { font-weight: 700; font-size: 1.1rem; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loading { text-align: center; padding: 50px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Portfolio Optimizer</h1>
        <p>Modelo de Markowitz con Matriz de Covarianza v3</p>
    </div>

    <div class="controls">
        <div class="input-group">
            <label>Presupuesto Total (€)</label>
            <input type="number" id="budget" value="1000" step="100">
        </div>
        <div class="input-group">
            <label>Perfil de Riesgo (Aversión: λ)</label>
            <input type="range" id="lambda" min="0" max="2" step="0.1" value="0.5">
            <div style="display:flex; justify-content: space-between; font-size: 0.7rem;">
                <span>Agresivo (Retorno)</span>
                <span>Conservador (Estable)</span>
            </div>
        </div>
        <button class="btn-optimize" onclick="runOptimization()">Generar Cartera Óptima</button>
    </div>

    <div id="summary-container"></div>
    <div id="results-container" class="results-grid">
        <div class="loading">Cargando datos estadísticos de Google Sheets...</div>
    </div>
    <div id="charts-container" style="display:none; margin-top:20px;">
        <div class="chart-card">
            <p class="chart-title">Evolución histórica de acciones recomendadas</p>
            <canvas id="assets-chart" height="120"></canvas>
        </div>
        <div class="chart-card">
            <p class="chart-title">Evolución histórica de la cartera recomendada</p>
            <canvas id="portfolio-chart" height="120"></canvas>
        </div>
    </div>
</div>

<script>
// --- CONFIGURACIÓN DE URLs ---
const URL_DATOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsnmjygWG6TxoCh01ThLVM5YDD5NOQnMkBgMHxVqc9MF8d2fn1J7LCUyItMoZ-BoGfL5iU0Dw2yLWR/pub?gid=2022586956&single=true&output=csv';
const URL_ANALISIS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRsnmjygWG6TxoCh01ThLVM5YDD5NOQnMkBgMHxVqc9MF8d2fn1J7LCUyItMoZ-BoGfL5iU0Dw2yLWR/pub?gid=459208884&single=true&output=csv';

let stockStats = []; // Ticker, Media, Vol, CovMatrix
let historicalByTicker = {}; // { TICKER: [ {date, price} ] }
let assetsChart = null;
let portfolioChart = null;

function normalizeHeader(h) {
    return String(h || '').trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9_]/g, '');
}

function parseDateLabel(value) {
    const s = String(value || '').trim();
    const match = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!match) return null;
    const day = Number(match[1]);
    const month = Number(match[2]) - 1;
    const year = Number(match[3]);
    const d = new Date(year, month, day);
    return Number.isNaN(d.getTime()) ? null : d;
}

function isDateHeader(value) {
    return parseDateLabel(value) !== null;
}

function sortDateLabels(labels) {
    return [...labels].sort((a, b) => parseDateLabel(a) - parseDateLabel(b));
}

function parseCSV(text) {
    const raw = String(text || '').replace(/^\uFEFF/, ''); // quitar BOM
    const firstLine = raw.split(/\r?\n/)[0] || '';
    const commaCount = (firstLine.match(/,/g) || []).length;
    const semicolonCount = (firstLine.match(/;/g) || []).length;
    const tabCount = (firstLine.match(/\t/g) || []).length;
    const delimiter = tabCount > Math.max(commaCount, semicolonCount)
        ? '\t'
        : (semicolonCount > commaCount ? ';' : ',');

    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < raw.length; i++) {
        const ch = raw[i];
        const next = raw[i + 1];

        if (ch === '"') {
            if (inQuotes && next === '"') {
                field += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (ch === delimiter && !inQuotes) {
            row.push(field);
            field = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
            if (ch === '\r' && next === '\n') i++;
            row.push(field);
            if (row.some(c => String(c).trim() !== '')) rows.push(row);
            row = [];
            field = '';
        } else {
            field += ch;
        }
    }

    if (field.length > 0 || row.length > 0) {
        row.push(field);
        if (row.some(c => String(c).trim() !== '')) rows.push(row);
    }

    if (!rows.length) return { headers: [], records: [] };

    const headers = rows[0].map(h => String(h).trim());
    const records = rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => obj[h] = (r[idx] ?? '').trim());
        return obj;
    });

    return { headers, records };
}

function toNumber(v) {
    if (v === null || v === undefined) return NaN;
    let s = String(v).trim().replace(/\s/g, '');
    if (!s) return NaN;

    // Detectar formato decimal:
    // 1) "1.234,56" => miles='.' decimal=','
    // 2) "1,234.56" => miles=',' decimal='.'
    // 3) "1234,56"  => decimal=','
    // 4) "1234.56"  => decimal='.'
    if (s.includes(',') && s.includes('.')) {
        const lastComma = s.lastIndexOf(',');
        const lastDot = s.lastIndexOf('.');
        if (lastComma > lastDot) {
            s = s.replace(/\./g, '').replace(',', '.');
        } else {
            s = s.replace(/,/g, '');
        }
    } else if (s.includes(',')) {
        s = s.replace(',', '.');
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
}

function pickFirstKey(headers, aliases) {
    const normalized = headers.map(h => ({ raw: h, n: normalizeHeader(h) }));
    for (const a of aliases) {
        const found = normalized.find(h => h.n === a || h.n.includes(a));
        if (found) return found.raw;
    }
    return null;
}

function findHeaderByTicker(headers, ticker) {
    return headers.find(h => normalizeHeader(h) === normalizeHeader(ticker)) || null;
}

function getRowByAliases(rowMap, aliases) {
    for (const a of aliases) {
        const row = rowMap[normalizeHeader(a)];
        if (row) return row;
    }
    return null;
}

function isMetaRowLabel(label) {
    const n = normalizeHeader(label);
    const meta = [
        'price', 'precio', 'close', 'last', 'precios',
        'mu', 'media', 'mean', 'retorno', 'return', 'expectedreturn',
        'vol', 'volatilidad', 'std', 'sigma',
        'ticker', 'symbol', 'activo', 'asset'
    ];
    return meta.includes(n);
}

function buildStockStats(textAnalisis) {
    const analisis = parseCSV(textAnalisis);

    if (!analisis.records.length) {
        throw new Error('CSV de análisis vacío o inválido.');
    }

    const headers = analisis.headers;
    const rowTickerKey = pickFirstKey(headers, ['ticker', 'symbol', 'activo']) || headers[0];
    const priceKey = pickFirstKey(headers, ['price', 'precio', 'close', 'last']);
    const muKey = pickFirstKey(headers, ['mu', 'media', 'mean', 'retorno', 'return']);
    const volKey = pickFirstKey(headers, ['vol', 'volatilidad', 'std', 'sigma']);

    const rowTickers = analisis.records
        .map(r => String(r[rowTickerKey] || '').trim())
        .filter(Boolean);

    if (!rowTickers.length) {
        throw new Error('No se encontraron tickers en la primera columna del CSV de análisis.');
    }

    const tickers = headers.filter(h => rowTickers.some(t => normalizeHeader(t) === normalizeHeader(h)));
    const finalTickers = (tickers.length ? tickers : rowTickers)
        .filter(t => !isMetaRowLabel(t));

    if (!finalTickers.length) {
        throw new Error('No se pudieron identificar tickers válidos en el CSV de análisis.');
    }

    const covByTicker = {};

    const rowMap = {};
    for (const row of analisis.records) {
        const rt = String(row[rowTickerKey] || '').trim();
        if (!rt) continue;
        rowMap[normalizeHeader(rt)] = row;

        covByTicker[rt] = {};
        for (const t of finalTickers) {
            const k = headers.find(h => normalizeHeader(h) === normalizeHeader(t));
            if (!k) continue;
            const v = toNumber(row[k]);
            if (Number.isFinite(v)) covByTicker[rt][t] = v;
        }
    }

    const priceRow = getRowByAliases(rowMap, ['price', 'precio', 'close', 'last', 'precios']);
    const muRow = getRowByAliases(rowMap, ['mu', 'media', 'mean', 'retorno', 'return', 'expectedreturn']);

    stockStats = finalTickers.map(t => {
        const row = rowMap[normalizeHeader(t)] || null;
        const headerTicker = findHeaderByTicker(headers, t);

        let price = NaN;
        if (row && priceKey) {
            price = toNumber(row[priceKey]);
        }
        if (!Number.isFinite(price) && priceRow && headerTicker) {
            price = toNumber(priceRow[headerTicker]);
        }

        let mu = NaN;
        if (row && muKey) {
            mu = toNumber(row[muKey]);
        }
        if (!Number.isFinite(mu) && muRow && headerTicker) {
            mu = toNumber(muRow[headerTicker]);
        }

        const vol = row && volKey ? toNumber(row[volKey]) : 0;

        return {
            ticker: t,
            price,
            mu,
            vol: Number.isFinite(vol) ? vol : 0,
            cov: finalTickers.map(t2 => {
                if (covByTicker[t] && Number.isFinite(covByTicker[t][t2])) {
                    return covByTicker[t][t2];
                }
                if (t === t2 && Number.isFinite(vol) && vol > 0) return vol * vol;
                return 0;
            })
        };
    }).filter(s => s.ticker);

    if (!stockStats.length) {
        throw new Error('No se pudieron construir activos válidos desde el CSV de análisis.');
    }
}

function buildStatsFromDatos(textDatos) {
    const datos = parseCSV(textDatos);
    if (!datos.records.length) {
        throw new Error('CSV de datos vacío o inválido.');
    }

    const headers = datos.headers;
    const tickerKey = pickFirstKey(headers, ['ticker', 'symbol', 'activo', 'asset']);
    const priceKey = pickFirstKey(headers, ['price', 'precio', 'close', 'last']);
    const muKey = pickFirstKey(headers, ['mu', 'media', 'mean', 'retorno', 'return', 'expectedreturn']);

    const mapPrice = {};
    const mapMu = {};

    if (tickerKey && priceKey && muKey) {
        for (const r of datos.records) {
            const t = String(r[tickerKey] || '').trim();
            if (!t) continue;
            const p = toNumber(r[priceKey]);
            const m = toNumber(r[muKey]);
            if (Number.isFinite(p)) mapPrice[normalizeHeader(t)] = p;
            if (Number.isFinite(m)) mapMu[normalizeHeader(t)] = m;
        }
    }

    const dateHeaders = headers.filter(isDateHeader);
    if (tickerKey && dateHeaders.length) {
        const sortedDateHeaders = sortDateLabels(dateHeaders);
        for (const r of datos.records) {
            const ticker = String(r[tickerKey] || '').trim();
            if (!ticker) continue;

            const series = sortedDateHeaders
                .map(date => ({ date, price: toNumber(r[date]) }))
                .filter(point => Number.isFinite(point.price));

            if (!series.length) continue;

            mapPrice[normalizeHeader(ticker)] = series[series.length - 1].price;

            if (!Number.isFinite(mapMu[normalizeHeader(ticker)])) {
                const returns = [];
                for (let i = 1; i < series.length; i++) {
                    const prev = series[i - 1].price;
                    const curr = series[i].price;
                    if (Number.isFinite(prev) && prev > 0 && Number.isFinite(curr)) {
                        returns.push((curr / prev) - 1);
                    }
                }
                if (returns.length) {
                    const avgReturn = returns.reduce((sum, val) => sum + val, 0) / returns.length;
                    mapMu[normalizeHeader(ticker)] = avgReturn;
                }
            }
        }
    }

    return { mapPrice, mapMu, datos };
}

function buildHistoricalFromDatos(datosCsv, tickers) {
    const datos = datosCsv.records ? datosCsv : parseCSV(datosCsv);
    const headers = datos.headers;
    if (!headers.length || !datos.records.length) return {};

    const dateKey = pickFirstKey(headers, ['date', 'fecha', 'time', 'datetime', 'dia']);
    const tickerKey = pickFirstKey(headers, ['ticker', 'symbol', 'activo', 'asset']);

    const out = {};
    for (const t of tickers) out[t] = [];

    const dateHeaders = headers.filter(isDateHeader);
    if (tickerKey && dateHeaders.length) {
        const sortedDateHeaders = sortDateLabels(dateHeaders);
        for (const row of datos.records) {
            const ticker = String(row[tickerKey] || '').trim();
            if (!ticker || !out[ticker]) continue;
            out[ticker] = sortedDateHeaders
                .map(date => ({ date, price: toNumber(row[date]) }))
                .filter(point => Number.isFinite(point.price));
        }
        return out;
    }

    if (!dateKey) return {};

    const tickerHeaderMap = {};
    for (const t of tickers) {
        const h = findHeaderByTicker(headers, t);
        if (h) tickerHeaderMap[t] = h;
    }

    for (const row of datos.records) {
        const date = String(row[dateKey] || '').trim();
        if (!date) continue;

        for (const t of tickers) {
            const h = tickerHeaderMap[t];
            if (!h) continue;
            const p = toNumber(row[h]);
            if (!Number.isFinite(p)) continue;
            out[t].push({ date, price: p });
        }
    }

    return out;
}

function mergeStatsWithDatos(stats, datosInfo) {
    const missing = [];
    for (const s of stats) {
        const nk = normalizeHeader(s.ticker);
        const p = datosInfo.mapPrice[nk];
        const m = datosInfo.mapMu[nk];
        if (Number.isFinite(p)) s.price = p;
        if (Number.isFinite(m)) s.mu = m;
        if (!Number.isFinite(s.price) || !Number.isFinite(s.mu)) {
            missing.push(s.ticker);
        }
    }
    if (missing.length) {
        throw new Error(`Faltan precio/mu para: ${missing.join(', ')}. Revisa hoja Datos.`);
    }
}

async function fetchCsvWithFallback(url) {
    const finalUrl = `${url}&t=${Date.now()}`;
    const tries = [];

    tries.push(finalUrl);
    tries.push(`https://api.allorigins.win/raw?url=${encodeURIComponent(finalUrl)}`);

    let lastError = null;
    for (const u of tries) {
        try {
            const res = await fetch(u, { redirect: 'follow' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
        } catch (err) {
            lastError = err;
        }
    }

    throw lastError || new Error('No se pudo descargar el CSV.');
}

async function loadData() {
    try {
        const [textDatos, textAnalisis] = await Promise.all([
            fetchCsvWithFallback(URL_DATOS),
            fetchCsvWithFallback(URL_ANALISIS)
        ]);

        buildStockStats(textAnalisis);
        const datosInfo = buildStatsFromDatos(textDatos);
        mergeStatsWithDatos(stockStats, datosInfo);
        historicalByTicker = buildHistoricalFromDatos(datosInfo.datos, stockStats.map(s => s.ticker));

        console.log("Datos cargados correctamente", stockStats.length);
        document.getElementById('results-container').innerHTML =
            `<div class="loading" style="color:#10b981"><b>Datos cargados:</b> ${stockStats.length} activos listos para optimizar.</div>`;
        
    } catch (e) {
        console.error("Error detallado:", e);
        document.getElementById('results-container').innerHTML = 
            `<div class="loading" style="color:red">
                <b>Error de Conexión:</b><br>
                ${e.message}<br><br>
                <i>Si estás en file:// puede bloquear por CORS. Soluciones:</i><br>
                <i>1) Publicar la hoja en Google (acceso público),</i><br>
                <i>2) Abrir esta web desde servidor (localhost o hosting).</i>
            </div>`;
            document.getElementById('charts-container').style.display = 'none';
    }
}

function runOptimization() {
    const budget = parseFloat(document.getElementById('budget').value);
    const lambda = parseFloat(document.getElementById('lambda').value);
    
    if (stockStats.length === 0) return;

    // --- ALGORITMO: GREEDY SMART + LOCAL SEARCH ---
    // (Debido a la complejidad de Markowitz discreto, usamos un Greedy ponderado por Sharpe 
    // y ajustado por covarianza incremental)
    
    let remainingBudget = budget;
    let portfolio = stockStats.map(s => ({ ...s, qty: 0 }));
    let totalInvested = 0;

    // Proceso iterativo: añadimos la acción que mejor mejora la función objetivo (Markowitz)
    // Función Objetivo: Sum(qty*price*mu) - lambda * Variancia_Cartera
    
    while(true) {
        let bestScore = -Infinity;
        let bestStockIdx = -1;

        for(let i=0; i<portfolio.length; i++) {
            const s = portfolio[i];
            if(remainingBudget < s.price) continue;

            // Calculamos el impacto de añadir UNA acción más de este tipo
            // 1. Retorno incremental
            const addedReturn = s.price * s.mu;
            
            // 2. Riesgo incremental (Covarianzas)
            let addedRisk = 0;
            for(let j=0; j<portfolio.length; j++) {
                const s2 = portfolio[j];
                // 2 * qty_i * qty_j * cov_ij
                addedRisk += 2 * (portfolio[i].qty + 1) * s.price * portfolio[j].qty * s2.price * s.cov[j];
            }
            // Riesgo propio
            addedRisk += Math.pow(s.price, 2) * s.cov[i];

            const score = addedReturn - (lambda * addedRisk / budget);

            if(score > bestScore) {
                bestScore = score;
                bestStockIdx = i;
            }
        }

        if(bestStockIdx === -1) break; // No caben más acciones o no mejoran el perfil
        
        portfolio[bestStockIdx].qty++;
        remainingBudget -= portfolio[bestStockIdx].price;
        totalInvested += portfolio[bestStockIdx].price;
    }

    renderResults(portfolio, totalInvested, budget);
}

function renderResults(portfolio, invested, budget) {
    const resultsCont = document.getElementById('results-container');
    const summaryCont = document.getElementById('summary-container');
    resultsCont.innerHTML = '';
    
    const activeItems = portfolio.filter(p => p.qty > 0);

    activeItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'stock-card';
        card.innerHTML = `
            <div>
                <div class="ticker">${item.ticker}</div>
                <div class="qty">${item.qty} acciones × $${item.price.toFixed(2)}</div>
            </div>
            <div class="price">$${(item.qty * item.price).toFixed(2)}</div>
        `;
        resultsCont.appendChild(card);
    });

    summaryCont.innerHTML = `
        <div class="summary-card">
            <div>
                <div style="font-size:0.8rem; opacity:0.8">Invertido</div>
                <div style="font-size:1.4rem; font-weight:700">$${invested.toFixed(2)}</div>
            </div>
            <div>
                <div style="font-size:0.8rem; opacity:0.8">Efectivo Sobrante</div>
                <div style="font-size:1.4rem; font-weight:700">$${(budget - invested).toFixed(2)}</div>
            </div>
            <div>
                <div style="font-size:0.8rem; opacity:0.8">Eficiencia</div>
                <div style="font-size:1.4rem; font-weight:700">${((invested/budget)*100).toFixed(1)}%</div>
            </div>
        </div>
    `;

    renderCharts(activeItems);
}

function renderCharts(activeItems) {
    const container = document.getElementById('charts-container');
    if (!activeItems.length) {
        container.style.display = 'none';
        return;
    }

    const available = activeItems.filter(a => Array.isArray(historicalByTicker[a.ticker]) && historicalByTicker[a.ticker].length > 2);
    if (!available.length) {
        container.style.display = 'none';
        return;
    }

    container.style.display = 'block';

    const dateSet = new Set();
    for (const a of available) {
        for (const p of historicalByTicker[a.ticker]) dateSet.add(p.date);
    }
    const dates = sortDateLabels(Array.from(dateSet));

    const colors = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#84cc16', '#f97316'];

    const datasetsAssets = available.map((a, idx) => {
        const map = new Map(historicalByTicker[a.ticker].map(x => [x.date, x.price]));
        let base = null;
        const values = dates.map(d => {
            const v = map.get(d);
            if (!Number.isFinite(v)) return null;
            if (base === null) base = v;
            if (!Number.isFinite(base) || base === 0) return null;
            return (v / base) * 100;
        });
        return {
            label: `${a.ticker} (base=100)`,
            data: values,
            spanGaps: true,
            borderColor: colors[idx % colors.length],
            backgroundColor: colors[idx % colors.length],
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.15
        };
    });

    const portfolioSeries = dates.map(d => {
        let total = 0;
        let hasAny = false;
        for (const a of available) {
            const seriesMap = new Map(historicalByTicker[a.ticker].map(x => [x.date, x.price]));
            const price = seriesMap.get(d);
            if (Number.isFinite(price)) {
                total += a.qty * price;
                hasAny = true;
            }
        }
        return hasAny ? total : null;
    });

    if (assetsChart) assetsChart.destroy();
    if (portfolioChart) portfolioChart.destroy();

    assetsChart = new Chart(document.getElementById('assets-chart'), {
        type: 'line',
        data: { labels: dates, datasets: datasetsAssets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: { y: { title: { display: true, text: 'Índice base 100' } } }
        }
    });

    portfolioChart = new Chart(document.getElementById('portfolio-chart'), {
        type: 'line',
        data: {
            labels: dates,
            datasets: [{
                label: 'Valor cartera',
                data: portfolioSeries,
                spanGaps: true,
                borderColor: '#1e293b',
                backgroundColor: '#1e293b',
                borderWidth: 2.5,
                pointRadius: 0,
                tension: 0.15
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: { y: { title: { display: true, text: 'Valor ($)' } } }
        }
    });
}

// Iniciar carga
loadData();
</script>

</body>
</html>
