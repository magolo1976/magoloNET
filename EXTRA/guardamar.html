<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Reserva Piso Guardamar</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root{
			--bg:#eef3fb;
			--card:#ffffff;
			--text:#0f172a;
			--muted:#64748b;
			--line:#e2e8f0;
			--accent:#2563eb;
			--accent-2:#06b6d4;
			--shadow:0 10px 30px rgba(15,23,42,.08);
		}
		*{box-sizing:border-box}
		body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 10%, #dbeafe 0%, transparent 35%), var(--bg);color:var(--text)}
		.app{max-width:1240px;margin:24px auto;padding:0 16px 24px}

		.hero{
			background:linear-gradient(135deg, #1d4ed8, #0ea5e9 60%, #22d3ee);
			border-radius:18px;
			padding:18px;
			box-shadow:var(--shadow);
			margin-bottom:14px;
			color:#fff;
		}
		.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
		.title{font-size:1.35rem;font-weight:800;margin:0}
		.subtitle{margin:6px 0 0;font-size:.9rem;opacity:.9}
		.chips{display:flex;gap:8px;flex-wrap:wrap}
		.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:7px 10px;border-radius:999px;font-size:.78rem;font-weight:700;backdrop-filter:blur(4px)}

		.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 0;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:10px 12px}
		.year-nav{display:flex;align-items:center;gap:10px}
		.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;transition:.2s transform,.2s box-shadow,.2s background}
		.btn:hover{background:#f8fafc;transform:translateY(-1px);box-shadow:0 5px 12px rgba(2,6,23,.08)}
		.year-pill{min-width:98px;text-align:center;background:#dbeafe;color:#1e3a8a;border-radius:999px;padding:7px 14px;font-weight:800}
		.status{font-size:.88rem;color:#334155;min-height:20px;font-weight:600}

		.calendar-shell{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
		.calendar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
		@media (max-width:980px){.calendar-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
		@media (max-width:640px){.calendar-grid{grid-template-columns:1fr;}}

		.month-card{background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 16px rgba(15,23,42,.05)}
		.month-name{text-align:center;font-size:.8rem;letter-spacing:.08em;font-weight:800;color:#0284c7;margin:0 0 8px;padding-bottom:7px;border-bottom:1px dashed #dbeafe}
		table{width:100%;border-collapse:collapse;table-layout:fixed}
		th{font-size:.64rem;color:#64748b;padding:4px 0;font-weight:700}
		td{padding:2px;height:34px;vertical-align:top}
		.day-btn{width:100%;height:100%;border:1px solid transparent;background:#f8fafc;border-radius:9px;font-size:.76rem;color:#111827;cursor:pointer;position:relative;transition:.2s transform,.2s box-shadow,.2s border-color}
		.day-btn:hover{background:#ffffff;border-color:#bfdbfe;transform:translateY(-1px);box-shadow:0 4px 10px rgba(37,99,235,.15)}
		.day-num{position:absolute;top:4px;left:5px;font-weight:600}
		.reserved{background:var(--res-color, #93c5fd);border-color:rgba(15,23,42,.18)}
		.reserved .day-num{color:#0f172a}
		.reserved::after{content:'';position:absolute;right:5px;bottom:5px;width:6px;height:6px;border-radius:999px;background:#0f172a;opacity:.8}
		.is-today{outline:2px solid #2563eb;outline-offset:-2px}
		.empty{background:transparent}

		.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
		.legend-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:#475569}
		.dot{width:12px;height:12px;border-radius:3px;border:1px solid rgba(15,23,42,.15)}

		.modal{position:fixed;inset:0;background:rgba(2,6,23,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
		.modal.show{display:flex}
		.panel{width:min(560px,100%);background:#fff;border-radius:16px;border:1px solid var(--line);padding:16px;box-shadow:0 20px 45px rgba(2,6,23,.25)}
		.panel h3{margin:0 0 10px;font-size:1rem}
		.muted{font-size:.84rem;color:var(--muted);margin:0 0 12px}
		textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
		.palette{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:10px}
		.swatch{height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer}
		.swatch.active{border-color:#0f172a;box-shadow:0 0 0 2px #fff inset}
		.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
		.left-actions,.right-actions{display:flex;gap:8px}
		.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
		.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}
	</style>
</head>
<body>
	<div class="app">
		<section class="hero">
			<div class="hero-top">
				<div>
					<h1 class="title">Reserva de Piso · Guardamar</h1>
					<p class="subtitle">Calendario anual de disponibilidad y reservas compartidas.</p>
				</div>
				<div class="chips">
					<span class="chip">Año: <strong id="chipYear">2026</strong></span>
					<span class="chip">Reservas: <strong id="chipCount">0</strong></span>
				</div>
			</div>

			<div class="topbar">
				<div id="status" class="status">Cargando calendario...</div>
				<div class="year-nav">
					<button id="prevYearBtn" class="btn" aria-label="Año anterior">◀</button>
					<div id="yearPill" class="year-pill">2026</div>
					<button id="nextYearBtn" class="btn" aria-label="Año siguiente">▶</button>
				</div>
			</div>
		</section>

		<section class="calendar-shell">
			<div id="calendarGrid" class="calendar-grid"></div>
		</section>

		<div class="legend" id="legend"></div>
	</div>

	<div id="modal" class="modal" role="dialog" aria-modal="true">
		<div class="panel">
			<h3>Reserva del día</h3>
			<p id="modalDate" class="muted"></p>

			<label for="noteInput" class="muted" style="display:block;margin-bottom:6px">Texto de reserva</label>
			<textarea id="noteInput" maxlength="220" placeholder="Ejemplo: Familia Pérez · entrada 15:00"></textarea>

			<label class="muted" style="display:block;margin-top:10px">Color base (elige 1)</label>
			<div id="palette" class="palette"></div>

			<div class="actions">
				<div class="left-actions">
					<button id="closeModalBtn" class="btn">Cancelar</button>
				</div>
				<div class="right-actions">
					<button id="deleteBtn" class="btn btn-danger">Borrar</button>
					<button id="saveBtn" class="btn btn-primary">Guardar</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		// ===== Configuración =====
		// Pega aquí tu URL /exec de Apps Script.
		const API_URL = 'https://script.google.com/macros/s/AKfycbz8QVUObZBibiJ69riyIYhj4H3oNxdJ6p0uTPAVEdJZxXAINM78Dnitmj71Bke0ayiOtg/exec';
		// Deja vacío si el API es pública.
		const API_KEY = '';

		// Fallback local para pruebas visuales (si API_URL está vacío).
		const ENABLE_LOCAL_FALLBACK = true;

		const MONTHS = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
		const WEEK = ['L','M','X','J','V','S','D'];
		const COLORS = ['#fecaca','#fde68a','#bbf7d0','#bfdbfe','#ddd6fe','#fbcfe8','#fdba74','#a7f3d0','#bae6fd','#e5e7eb'];

		let currentYear = new Date().getFullYear();
		let reservations = new Map(); // fecha YYYY-MM-DD => { texto, color }
		let selectedDate = null;
		let selectedColor = COLORS[0];

		const $ = (id) => document.getElementById(id);

		function setStatus(msg, isError = false) {
			const el = $('status');
			el.textContent = msg;
			el.style.color = isError ? '#b91c1c' : '#334155';
		}

		function fmt2(n){ return String(n).padStart(2, '0'); }
		function dateKey(y,m,d){ return `${y}-${fmt2(m+1)}-${fmt2(d)}`; }
		function prettyDate(key){
			if (!key || typeof key !== 'string') return '';
			const [y,m,d] = key.split('-').map(Number);
			if (!y || !m || !d) return String(key);
			return `${fmt2(d)}/${fmt2(m)}/${y}`;
		}

		function isHexColor(v) {
			return /^#[0-9a-fA-F]{6}$/.test(String(v || '').trim());
		}

		function getDaysInMonth(year, month) {
			return new Date(year, month + 1, 0).getDate();
		}

		function mondayFirstDay(jsDay) {
			return jsDay === 0 ? 6 : jsDay - 1;
		}

		function isToday(y,m,d){
			const t = new Date();
			return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d;
		}

		function renderLegend() {
			$('legend').innerHTML = COLORS.map((c,i)=>
				`<div class="legend-item"><span class="dot" style="background:${c}"></span><span>Color ${i+1}</span></div>`
			).join('');
		}

		function renderCalendar() {
			$('yearPill').textContent = String(currentYear);
			$('chipYear').textContent = String(currentYear);
			const container = $('calendarGrid');
			container.innerHTML = '';
			let reservedCount = 0;

			for (let month = 0; month < 12; month++) {
				const card = document.createElement('section');
				card.className = 'month-card';

				const h = document.createElement('p');
				h.className = 'month-name';
				h.textContent = MONTHS[month];
				card.appendChild(h);

				const table = document.createElement('table');
				table.innerHTML = `<thead><tr>${WEEK.map(w=>`<th>${w}</th>`).join('')}</tr></thead>`;

				const tbody = document.createElement('tbody');
				const firstDay = mondayFirstDay(new Date(currentYear, month, 1).getDay());
				const total = getDaysInMonth(currentYear, month);

				let day = 1;
				for (let row = 0; row < 6; row++) {
					const tr = document.createElement('tr');
					for (let col = 0; col < 7; col++) {
						const td = document.createElement('td');
						if ((row === 0 && col < firstDay) || day > total) {
							td.className = 'empty';
						} else {
							const key = dateKey(currentYear, month, day);
							const data = reservations.get(key);
							const btn = document.createElement('button');
							btn.className = 'day-btn';
							if (isToday(currentYear, month, day)) btn.classList.add('is-today');
							if (data && data.texto && data.color) {
								btn.classList.add('reserved');
								btn.style.setProperty('--res-color', data.color);
								btn.title = data.texto;
								reservedCount++;
							}
							btn.innerHTML = `<span class="day-num">${day}</span>`;
							btn.addEventListener('click', () => openModal(key));
							td.appendChild(btn);
							day++;
						}
						tr.appendChild(td);
					}
					tbody.appendChild(tr);
					if (day > total) break;
				}

				table.appendChild(tbody);
				card.appendChild(table);
				container.appendChild(card);
			}

			$('chipCount').textContent = String(reservedCount);
		}

		function renderPalette() {
			const p = $('palette');
			p.innerHTML = '';
			COLORS.forEach(c => {
				const el = document.createElement('button');
				el.className = 'swatch' + (c === selectedColor ? ' active' : '');
				el.style.background = c;
				el.title = c;
				el.addEventListener('click', () => {
					selectedColor = c;
					renderPalette();
				});
				p.appendChild(el);
			});
		}

		function openModal(dateStr) {
			selectedDate = dateStr;
			const existing = reservations.get(dateStr);
			$('modalDate').textContent = `Fecha: ${prettyDate(dateStr)}`;
			$('noteInput').value = existing?.texto || '';
			selectedColor = existing?.color || COLORS[0];
			renderPalette();
			$('deleteBtn').style.display = existing ? 'inline-block' : 'none';
			$('modal').classList.add('show');
		}

		function closeModal() {
			$('modal').classList.remove('show');
			selectedDate = null;
		}

		function readLocalStore() {
			const raw = localStorage.getItem('guardamar_reservas_v1') || '{}';
			return JSON.parse(raw);
		}

		function writeLocalStore(obj) {
			localStorage.setItem('guardamar_reservas_v1', JSON.stringify(obj));
		}

		async function apiList(year) {
			if (!API_URL && ENABLE_LOCAL_FALLBACK) {
				const all = readLocalStore();
				const rows = Object.entries(all)
					.filter(([fecha, v]) => fecha.startsWith(`${year}-`) && v && v.texto && v.color)
					.map(([fecha, v]) => ({ fecha, texto: v.texto, color: v.color }));
				return { ok: true, reservas: rows };
			}

			const body = new URLSearchParams();
			body.set('action', 'list');
			body.set('year', String(year));
			if (API_KEY) body.set('apiKey', API_KEY);
			const res = await fetch(API_URL, {
				method: 'POST',
				cache: 'no-store',
				body
			});
			return await res.json();
		}

		async function apiUpsert(fecha, texto, color) {
			if (!API_URL && ENABLE_LOCAL_FALLBACK) {
				const all = readLocalStore();
				all[fecha] = { texto, color };
				writeLocalStore(all);
				return { ok: true };
			}

			const body = new URLSearchParams();
			body.set('action', 'upsert');
			body.set('fecha', fecha);
			body.set('texto', texto);
			body.set('color', color);
			if (API_KEY) body.set('apiKey', API_KEY);
			const res = await fetch(API_URL, {
				method: 'POST',
				body
			});
			return await res.json();
		}

		async function apiDelete(fecha) {
			if (!API_URL && ENABLE_LOCAL_FALLBACK) {
				const all = readLocalStore();
				if (all[fecha]) {
					all[fecha] = { texto: '', color: '' };
					writeLocalStore(all);
				}
				return { ok: true };
			}

			const body = new URLSearchParams();
			body.set('action', 'delete');
			body.set('fecha', fecha);
			if (API_KEY) body.set('apiKey', API_KEY);
			const res = await fetch(API_URL, {
				method: 'POST',
				body
			});
			return await res.json();
		}

		async function loadYear(year) {
			setStatus(`Cargando reservas del ${year}...`);
			try {
				const payload = await apiList(year);
				if (!payload.ok) throw new Error(payload.error || 'Error al listar reservas');

				reservations = new Map();
				(payload.reservas || []).forEach(r => {
					const fecha = String(r.fecha || '').trim();
					const texto = String(r.texto || '').trim();
					const color = isHexColor(r.color) ? String(r.color).trim() : COLORS[0];
					if (/^\d{4}-\d{2}-\d{2}$/.test(fecha) && texto) {
						reservations.set(fecha, { texto, color });
					}
				});

				renderCalendar();
				const mode = API_URL ? 'Google Sheets' : 'modo local de prueba';
				setStatus(`Año ${year} cargado (${mode}).`);
			} catch (e) {
				setStatus(`Error: ${e.message}`, true);
			}
		}

		async function onSave() {
			if (!selectedDate) return;
			const targetDate = selectedDate;
			const texto = $('noteInput').value.trim();
			if (!texto) {
				alert('Debes introducir un texto para guardar la reserva.');
				return;
			}
			try {
				setStatus('Guardando reserva...');
				const payload = await apiUpsert(targetDate, texto, selectedColor);
				if (!payload.ok) throw new Error(payload.error || 'No se pudo guardar');

				reservations.set(targetDate, { texto, color: selectedColor });
				renderCalendar();
				closeModal();
				setStatus(`Reserva guardada en ${prettyDate(targetDate)}.`);
			} catch (e) {
				setStatus(`Error al guardar: ${e.message}`, true);
			}
		}

		async function onDelete() {
			if (!selectedDate) return;
			const targetDate = selectedDate;
			if (!confirm(`¿Borrar la reserva del ${prettyDate(targetDate)}?`)) return;

			try {
				setStatus('Borrando reserva...');
				const payload = await apiDelete(targetDate);
				if (!payload.ok) throw new Error(payload.error || 'No se pudo borrar');

				reservations.delete(targetDate);
				renderCalendar();
				closeModal();
				setStatus(`Reserva borrada en ${prettyDate(targetDate)}.`);
			} catch (e) {
				setStatus(`Error al borrar: ${e.message}`, true);
			}
		}

		function wireEvents() {
			$('prevYearBtn').addEventListener('click', () => {
				currentYear -= 1;
				loadYear(currentYear);
			});
			$('nextYearBtn').addEventListener('click', () => {
				currentYear += 1;
				loadYear(currentYear);
			});

			$('closeModalBtn').addEventListener('click', closeModal);
			$('saveBtn').addEventListener('click', onSave);
			$('deleteBtn').addEventListener('click', onDelete);
			$('modal').addEventListener('click', (e) => {
				if (e.target.id === 'modal') closeModal();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') closeModal();
			});
		}

		// Init
		renderLegend();
		wireEvents();
		loadYear(currentYear);
	</script>
</body>
</html>
