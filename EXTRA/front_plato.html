<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Comida</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    /* ===== DEBUG PANEL ===== */
    .debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.95);
      border: 2px solid #00ff00;
      border-radius: 8px;
      padding: 0;
      max-height: 180px;
      display: flex;
      flex-direction: column;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
    }

    .debug-header {
      background: #003300;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      border-bottom: 1px solid #00ff00;
    }

    .debug-header:hover {
      background: #005500;
    }

    .debug-toggle {
      width: 20px;
      height: 20px;
      background: #00ff00;
      color: #000;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .debug-content {
      overflow-y: auto;
      max-height: 150px;
      padding: 8px 12px;
      background: rgba(0, 30, 0, 0.8);
    }

    .debug-content.collapsed {
      display: none;
    }

    .debug-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .debug-tab-btn {
      background: #003300;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }

    .debug-tab-btn.active {
      background: #00ff00;
      color: #000;
    }

    .debug-tab-btn:hover {
      background: #00aa00;
      color: #000;
    }

    .debug-tab-content {
      display: none;
    }

    .debug-tab-content.active {
      display: block;
    }

    .debug-line {
      margin: 2px 0;
      word-break: break-all;
      line-height: 1.3;
    }

    .debug-success {
      color: #00ff00;
    }

    .debug-error {
      color: #ff4444;
    }

    .debug-warning {
      color: #ffaa00;
    }

    .debug-info {
      color: #00ddff;
    }

    /* ===== MAIN LAYOUT ===== */
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      overflow: hidden;
    }

    /* ===== START SCREEN ===== */
    .start-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .start-screen h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .start-screen p {
      font-size: 16px;
      color: #aaa;
      max-width: 300px;
    }

    .btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: #ff6b35;
      color: white;
    }

    .btn-primary:hover {
      background: #ff8555;
      transform: scale(1.05);
    }

    .btn-secondary {
      background: #444;
      color: white;
    }

    .btn-secondary:hover {
      background: #666;
    }

    /* ===== CAMERA VIEW ===== */
    .camera-view {
      display: none;
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 800px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .camera-view.active {
      display: flex;
      flex-direction: column;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .capture-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ===== SETTINGS BAR ===== */
    .settings-bar {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ff6b35;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .settings-bar button {
      background: #ff6b35;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .settings-bar button:hover {
      background: #ff8555;
      transform: scale(1.05);
    }

    .brightness-slider {
      width: 100px;
      height: 8px;
      cursor: pointer;
    }

    /* ===== CAPTURE CONTROLS ===== */
    .capture-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 15px;
      z-index: 100;
    }

    .capture-controls.active {
      display: flex;
    }

    .capture-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ff6b35;
      border: 4px solid white;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.5);
    }

    .capture-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.7);
    }

    .capture-btn:active {
      transform: scale(0.95);
    }

    .action-btn {
      padding: 12px 20px;
      background: #444;
      color: white;
      border: 2px solid #ff6b35;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      align-self: center;
    }

    .action-btn:hover {
      background: #666;
      transform: scale(1.05);
    }

    /* ===== PREVIEW SCREEN ===== */
    .preview-screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .preview-screen.active {
      display: flex;
    }

    .preview-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
    }

    .preview-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-info {
      text-align: center;
      font-size: 14px;
      color: #aaa;
    }

    .preview-info.success {
      color: #00ff00;
    }

    .preview-info.error {
      color: #ff4444;
    }

    .validation-result {
      font-size: 18px;
      font-weight: bold;
      padding: 15px 25px;
      border-radius: 8px;
      text-align: center;
      max-width: 500px;
    }

    .validation-result.valid {
      background: rgba(0, 255, 0, 0.2);
      border: 2px solid #00ff00;
      color: #00ff00;
    }

    .validation-result.invalid {
      background: rgba(255, 68, 68, 0.2);
      border: 2px solid #ff4444;
      color: #ff4444;
    }

    .preview-actions {
      display: flex;
      gap: 15px;
    }

    .preview-actions button {
      padding: 12px 25px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-accept {
      background: #00aa00;
      color: white;
    }

    .btn-accept:hover {
      background: #00dd00;
      transform: scale(1.05);
    }

    .btn-reject {
      background: #ff4444;
      color: white;
    }

    .btn-reject:hover {
      background: #ff6666;
      transform: scale(1.05);
    }

    /* ===== FILE INPUT ===== */
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
    }

    /* ===== LOADING ===== */
    .loading {
      display: none;
      text-align: center;
    }

    .loading.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #ff6b35;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== MOBILE OPTIMIZATION ===== */
    @media (max-width: 600px) {
      .debug-panel {
        top: 5px;
        left: 5px;
        right: 5px;
        font-size: 10px;
      }

      .start-screen h1 {
        font-size: 24px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 14px;
      }

      .preview-container {
        max-width: 350px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- DEBUG PANEL -->
    <div class="debug-panel">
      <div class="debug-header">
        <span>🔍 DEBUG</span>
        <button class="debug-toggle">−</button>
      </div>
      <div class="debug-content">
        <div class="debug-tabs">
          <button class="debug-tab-btn active" data-tab="log">Log</button>
          <button class="debug-tab-btn" data-tab="predictions">Predicciones</button>
          <button class="debug-tab-btn" data-tab="device">Dispositivo</button>
        </div>
        <div id="debug-log" class="debug-tab-content active"></div>
        <div id="debug-predictions" class="debug-tab-content"></div>
        <div id="debug-device" class="debug-tab-content"></div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
      <!-- START SCREEN -->
      <div id="startScreen" class="start-screen">
        <h1>🍽️ Escáner de Comida</h1>
        <p>Fotografía tu plato para analizarlo</p>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
          <button id="btnCamera" class="btn btn-primary">📷 Abrir Cámara</button>
          <div class="file-input-wrapper">
            <button class="btn btn-secondary">📁 Subir Foto</button>
            <input type="file" id="fileInput" accept="image/*">
          </div>
        </div>
      </div>

      <!-- CAMERA VIEW -->
      <div id="cameraView" class="camera-view">
        <video id="video" playsinline autoplay></video>
        <canvas id="captureOverlay" class="capture-overlay"></canvas>

        <div class="settings-bar">
          <button id="btnFlash">💡 Flash</button>
          <input type="range" id="brightnessSlider" class="brightness-slider" min="0" max="200" value="100" title="Brillo">
          <button id="btnClose">✕ Cerrar</button>
        </div>

        <div id="captureControls" class="capture-controls">
          <button id="btnCapture" class="capture-btn" title="Capturar foto"></button>
        </div>
      </div>

      <!-- PREVIEW SCREEN -->
      <div id="previewScreen" class="preview-screen">
        <div class="preview-container">
          <img id="previewImage" class="preview-image" src="" alt="Preview">
        </div>
        <div id="validationResult" class="validation-result"></div>
        <div id="previewInfo" class="preview-info"></div>
        <div class="preview-actions">
          <button id="btnAccept" class="btn btn-accept">✓ Aceptar</button>
          <button id="btnRetake" class="btn btn-reject">✕ Reintentar</button>
        </div>
      </div>

      <!-- LOADING -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Analizando imagen...</p>
      </div>
    </div>
  </div>

  <script>
    // ===== ESTADO GLOBAL =====
    const state = {
      currentStream: null,
      model: null,
      currentImage: null,
      isAnalyzing: false,
      isMobileDevice: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
      flashEnabled: false,
      brightness: 100
    };

    // ===== ELEMENTOS DEL DOM =====
    const els = {
      startScreen: document.getElementById('startScreen'),
      cameraView: document.getElementById('cameraView'),
      previewScreen: document.getElementById('previewScreen'),
      loading: document.getElementById('loading'),
      video: document.getElementById('video'),
      canvas: document.getElementById('captureOverlay'),
      btnCamera: document.getElementById('btnCamera'),
      btnCapture: document.getElementById('btnCapture'),
      btnClose: document.getElementById('btnClose'),
      btnAccept: document.getElementById('btnAccept'),
      btnRetake: document.getElementById('btnRetake'),
      btnFlash: document.getElementById('btnFlash'),
      brightnessSlider: document.getElementById('brightnessSlider'),
      fileInput: document.getElementById('fileInput'),
      previewImage: document.getElementById('previewImage'),
      validationResult: document.getElementById('validationResult'),
      previewInfo: document.getElementById('previewInfo'),
      debugLog: document.getElementById('debug-log'),
      debugPredictions: document.getElementById('debug-predictions'),
      debugDevice: document.getElementById('debug-device'),
      debugToggle: document.querySelector('.debug-toggle'),
      debugContent: document.querySelector('.debug-content'),
      debugTabs: document.querySelectorAll('.debug-tab-btn')
    };

    // ===== DEBUG SYSTEM =====
    const debugLog = {
      logs: [],
      predictions: [],
      maxLogs: 50,

      add(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = `[${timestamp}] ${message}`;
        this.logs.push({ message: logEntry, type });
        if (this.logs.length > this.maxLogs) this.logs.shift();
        this.render();
      },

      addPrediction(pred) {
        this.predictions.unshift(pred);
        if (this.predictions.length > 20) this.predictions.pop();
        this.render();
      },

      render() {
        // Log tab
        els.debugLog.innerHTML = this.logs
          .map(log => `<div class="debug-line debug-${log.type}">${log.message}</div>`)
          .join('');

        // Predictions tab
        els.debugPredictions.innerHTML = this.predictions.length
          ? this.predictions
              .map(p => `<div class="debug-line"><span class="debug-info">${p.className}</span>: <span class="${p.isFood ? 'debug-success' : 'debug-error'}">${(p.probability * 100).toFixed(1)}%</span></div>`)
              .join('')
          : '<div class="debug-line debug-warning">Sin predicciones aún</div>';
      }
    };

    // Debug panel toggle
    els.debugToggle.addEventListener('click', () => {
      els.debugContent.classList.toggle('collapsed');
      els.debugToggle.textContent = els.debugContent.classList.contains('collapsed') ? '+' : '−';
    });

    // Debug tabs
    els.debugTabs.forEach(btn => {
      btn.addEventListener('click', () => {
        els.debugTabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.debug-tab-content').forEach(tab => tab.classList.remove('active'));
        document.getElementById(`debug-${btn.dataset.tab}`).classList.add('active');
      });
    });

    // ===== CARGAR MODELO =====
    async function loadModel() {
      try {
        debugLog.add('Cargando modelo MobileNet...', 'info');
        state.model = await mobilenet.load();
        debugLog.add('✓ Modelo MobileNet cargado', 'success');
      } catch (err) {
        debugLog.add('✗ Error al cargar modelo: ' + err.message, 'error');
      }
    }

    // ===== INFORMACIÓN DEL DISPOSITIVO =====
    function updateDeviceInfo() {
      els.debugDevice.innerHTML = `
        <div class="debug-line"><span class="debug-info">Navegador:</span> ${navigator.userAgent.substring(0, 60)}</div>
        <div class="debug-line"><span class="debug-info">Móvil:</span> ${state.isMobileDevice ? 'Sí' : 'No'}</div>
        <div class="debug-line"><span class="debug-info">HTTPS:</span> ${location.protocol === 'https:' ? 'Sí ✓' : 'No ✗'}</div>
      `;
    }

    // ===== ABRIR CÁMARA =====
    els.btnCamera.addEventListener('click', async () => {
      try {
        debugLog.add('Iniciando cámara...', 'info');

        if (state.isMobileDevice) {
          // Paso 1: Solicitar permiso genérico para desbloquear labels
          debugLog.add('Solicitando permiso de cámara...', 'info');
          const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
          tempStream.getTracks().forEach(t => t.stop());
          debugLog.add('✓ Permiso otorgado', 'success');

          // Paso 2: Enumerar dispositivos
          debugLog.add('Enumerando cámaras disponibles...', 'info');
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoInputs = devices.filter(d => d.kind === 'videoinput');

          debugLog.add(`Encontradas ${videoInputs.length} cámaras`, 'info');
          videoInputs.forEach((cam, i) => {
            debugLog.add(`  ${i}: ${cam.label || '(sin etiqueta)'} [${cam.deviceId.substring(0, 10)}...]`, 'info');
          });

          // Paso 3: Buscar cámara trasera por label
          let backCam = videoInputs.find(d => 
            /back|rear|trasera|environment|principal|main/i.test(d.label)
          );

          if (backCam) {
            debugLog.add(`✓ Cámara trasera encontrada: ${backCam.label}`, 'success');
          } else if (videoInputs.length > 1) {
            backCam = videoInputs[videoInputs.length - 1];
            debugLog.add(`⚠ Usando cámara por heurística (última): ${backCam.label}`, 'warning');
          }

          if (!backCam && videoInputs.length === 1) {
            backCam = videoInputs[0];
            debugLog.add(`⚠ Solo hay una cámara, usando: ${backCam.label}`, 'warning');
          }

          if (!backCam) {
            throw new Error('No se encontró ninguna cámara disponible');
          }

          // Paso 4: Abrir con deviceId exacto (SIN facingMode)
          debugLog.add(`Abriendo cámara por deviceId: ${backCam.label}...`, 'info');
          state.currentStream = await navigator.mediaDevices.getUserMedia({
            video: {
              deviceId: { exact: backCam.deviceId },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
          debugLog.add('✓ Cámara abierta correctamente', 'success');

        } else {
          // PC: frontal (facingMode normal)
          debugLog.add('Detectado como PC, usando facingMode...', 'info');
          state.currentStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'user',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
          debugLog.add('✓ Cámara frontal abierta', 'success');
        }

        els.video.srcObject = state.currentStream;
        els.startScreen.style.display = 'none';
        els.cameraView.classList.add('active');
        els.captureControls.classList.add('active');
        requestAnimationFrame(drawCaptureMask);

      } catch (err) {
        debugLog.add(`✗ Error: ${err.message}`, 'error');
        alert('No se pudo acceder a la cámara:\n' + err.message);
      }
    });

    // ===== DIBUJAR MÁSCARA DE ENCUADRE =====
    function drawCaptureMask() {
      const video = els.video;
      const canvas = els.canvas;
      const ctx = canvas.getContext('2d');

      canvas.width = video.offsetWidth;
      canvas.height = video.offsetHeight;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(canvas.width, canvas.height) / 2.5;

      // Fondo oscuro
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Círculo transparente (comida visible)
      ctx.clearRect(centerX - radius, centerY - radius, radius * 2, radius * 2);
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#ff6b35';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Patrón de puntos en borde
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const x = centerX + Math.cos(angle) * (radius + 15);
        const y = centerY + Math.sin(angle) * (radius + 15);
        ctx.fillStyle = '#ff6b35';
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      if (els.cameraView.classList.contains('active')) {
        requestAnimationFrame(drawCaptureMask);
      }
    }

    // ===== CAPTURAR FOTO =====
    els.btnCapture.addEventListener('click', () => {
      const video = els.video;
      const tempCanvas = document.createElement('canvas');
      const ctx = tempCanvas.getContext('2d');

      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0);

      // Aplicar máscara circular (recorte + fondo negro)
      applyCircularMask(tempCanvas);

      tempCanvas.toBlob(blob => {
        state.currentImage = blob;
        showPreview(blob);
      }, 'image/jpeg', 0.7);
    });

    // ===== APLICAR MÁSCARA CIRCULAR =====
    function applyCircularMask(canvas) {
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(canvas.width, canvas.height) / 2.5;

      for (let i = 0; i < data.length; i += 4) {
        const pixelIndex = i / 4;
        const pixelX = pixelIndex % canvas.width;
        const pixelY = Math.floor(pixelIndex / canvas.width);

        const dx = pixelX - centerX;
        const dy = pixelY - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance > radius) {
          data[i + 3] = 0; // Alpha = 0 (transparente)
        }
      }

      ctx.putImageData(imageData, 0, 0);
    }

    // ===== MOSTRAR PREVIEW =====
    async function showPreview(blob) {
      els.cameraView.classList.remove('active');
      els.captureControls.classList.remove('active');
      els.previewScreen.classList.add('active');
      els.loading.classList.add('active');

      const url = URL.createObjectURL(blob);
      els.previewImage.src = url;

      await validateImage(blob);
    }

    // ===== VALIDAR IMAGEN =====
    const FOOD_KEYWORDS = [
      'food', 'dish', 'meal', 'plate', 'salad', 'soup', 'rice', 'pasta', 'bread',
      'meat', 'chicken', 'fish', 'vegetable', 'fruit', 'dessert', 'cake', 'pizza',
      'burger', 'sandwich', 'taco', 'noodle', 'dumpling', 'sushi', 'steak', 'pork',
      'beef', 'pork chop', 'fried rice', 'fried chicken', 'grilled', 'roasted',
      'comida', 'plato', 'ensalada', 'sopa', 'arroz', 'pasta', 'pan', 'carne',
      'pollo', 'pescado', 'verdura', 'fruta', 'postre', 'pastel', 'pizza', 'hamburguesa'
    ];

    const INVALID_KEYWORDS = [
      'plate', 'bowl', 'cup', 'glass', 'dish', 'fork', 'spoon', 'knife', 'empty',
      'plato vacio', 'vaso', 'copa', 'cubierto'
    ];

    async function validateImage(blob) {
      try {
        if (!state.model) {
          throw new Error('Modelo no cargado');
        }

        const img = new Image();
        img.onload = async () => {
          try {
            debugLog.add('Ejecutando predicción...', 'info');
            const predictions = await state.model.classify(img);

            debugLog.add(`Predicciones: ${predictions.length} clases detectadas`, 'info');

            // Mostrar top 5
            predictions.slice(0, 5).forEach((pred, idx) => {
              const prob = (pred.probability * 100).toFixed(1);
              debugLog.add(`  ${idx + 1}. ${pred.className}: ${prob}%`, 'info');
              debugLog.addPrediction({
                className: pred.className,
                probability: pred.probability,
                isFood: isFoodPrediction(pred)
              });
            });

            // Validar
            const isValid = validatePredictions(predictions);

            els.loading.classList.remove('active');
            showValidationResult(isValid, predictions);

          } catch (err) {
            debugLog.add(`✗ Error en predicción: ${err.message}`, 'error');
            els.loading.classList.remove('active');
            showValidationResult(false, []);
          }
        };
        img.src = URL.createObjectURL(blob);
      } catch (err) {
        debugLog.add(`✗ Error: ${err.message}`, 'error');
        els.loading.classList.remove('active');
        showValidationResult(false, []);
      }
    }

    function isFoodPrediction(pred) {
      const keywords = [...FOOD_KEYWORDS];
      return keywords.some(kw => pred.className.toLowerCase().includes(kw));
    }

    function validatePredictions(predictions) {
      if (!predictions || predictions.length === 0) {
        debugLog.add('⚠ No hay predicciones', 'warning');
        return false;
      }

      // Top 3 predicciones
      const topPreds = predictions.slice(0, 3);

      // Buscar comida
      const hasFoodInTop = topPreds.some(p => {
        const isFood = isFoodPrediction(p);
        const minScore = 0.1; // 10%
        return isFood && p.probability >= minScore;
      });

      if (!hasFoodInTop) {
        debugLog.add('✗ No detectada comida en top 3', 'error');
        return false;
      }

      // Verificar que NO sea plato/vaso vacío
      const isEmptyDisease = topPreds.some(p => {
        const isInvalid = INVALID_KEYWORDS.some(kw => 
          p.className.toLowerCase().includes(kw)
        );
        const isTopScore = p.probability >= 0.2; // 20%
        return isInvalid && isTopScore;
      });

      if (isEmptyDisease) {
        debugLog.add('✗ Detectado plato/vaso vacío o sin comida', 'warning');
        return false;
      }

      debugLog.add('✓ Imagen válida: contiene comida', 'success');
      return true;
    }

    function showValidationResult(isValid, predictions) {
      if (isValid) {
        const topFood = predictions.find(p => isFoodPrediction(p));
        els.validationResult.className = 'validation-result valid';
        els.validationResult.textContent = `✓ ${topFood?.className || 'Comida'} detectada`;
        els.previewInfo.className = 'preview-info success';
        els.previewInfo.textContent = `Confianza: ${(topFood?.probability * 100).toFixed(0)}%`;
      } else {
        els.validationResult.className = 'validation-result invalid';
        els.validationResult.textContent = '✗ No se detectó comida válida';
        els.previewInfo.className = 'preview-info error';
        els.previewInfo.textContent = 'Intenta nuevamente con una foto más clara';
      }
    }

    // ===== BOTONES DE PREVIEW =====
    els.btnAccept.addEventListener('click', () => {
      alert('✓ Imagen aceptada y enviada al servidor');
      resetApp();
    });

    els.btnRetake.addEventListener('click', () => {
      els.previewScreen.classList.remove('active');
      els.cameraView.classList.add('active');
      els.captureControls.classList.add('active');
      URL.revokeObjectURL(els.previewImage.src);
      requestAnimationFrame(drawCaptureMask);
    });

    // ===== CERRAR CÁMARA =====
    els.btnClose.addEventListener('click', () => {
      if (state.currentStream) {
        state.currentStream.getTracks().forEach(track => track.stop());
        state.currentStream = null;
      }
      els.cameraView.classList.remove('active');
      els.captureControls.classList.remove('active');
      els.startScreen.style.display = 'flex';
      debugLog.add('Cámara cerrada', 'info');
    });

    // ===== SUBIR ARCHIVO =====
    els.fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      debugLog.add(`Archivo seleccionado: ${file.name}`, 'info');

      // Validar tipo
      if (!file.type.startsWith('image/')) {
        debugLog.add('✗ El archivo no es una imagen', 'error');
        alert('Por favor sube una imagen');
        return;
      }

      // Reducir calidad
      const blob = await reduceImageQuality(file);
      showPreview(blob);
    });

    async function reduceImageQuality(file) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          applyCircularMask(canvas);
          canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.7);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // ===== CONTROLES ADICIONALES =====
    els.btnFlash.addEventListener('click', () => {
      state.flashEnabled = !state.flashEnabled;
      els.btnFlash.textContent = state.flashEnabled ? '💡 Flash ON' : '💡 Flash';
      debugLog.add(`Flash: ${state.flashEnabled ? 'ON' : 'OFF'}`, 'info');
    });

    els.brightnessSlider.addEventListener('input', (e) => {
      state.brightness = e.target.value;
      els.video.style.filter = `brightness(${state.brightness}%)`;
      debugLog.add(`Brillo: ${state.brightness}%`, 'info');
    });

    // ===== RESET =====
    function resetApp() {
      els.previewScreen.classList.remove('active');
      els.startScreen.style.display = 'flex';
      els.fileInput.value = '';
      if (state.currentImage) URL.revokeObjectURL(state.currentImage);
      state.currentImage = null;
    }

    // ===== INICIALIZACIÓN =====
    async function init() {
      debugLog.add('Inicializando aplicación...', 'info');
      updateDeviceInfo();
      await loadModel();
      debugLog.add('✓ Aplicación lista', 'success');
    }

    init();
  </script>
</body>
</html>
