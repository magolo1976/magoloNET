<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de Plato de Comida</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #1a1a1a;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }

  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: #ff6b35;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }

  button:disabled { background: #555; }

  input[type="file"] { display: none; }

  /* Contenedor de captura (cámara o preview de archivo) */
  #captureStage {
    position: relative;
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    display: none;
    margin-bottom: 15px;
  }

  #captureStage video,
  #captureStage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Overlay circular fijo */
  .circle-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 80%;
    height: 80%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px dashed #ff6b35;
    box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }

  #confirmCaptureBtn {
    display: none;
    margin-bottom: 15px;
  }

  /* Visor final, solo aparece si hay imagen validada */
  #resultViewer {
    display: none;
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid #4caf50;
    margin-bottom: 15px;
  }

  #resultViewer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #status {
    text-align: center;
    min-height: 24px;
    font-size: 0.95rem;
    margin-bottom: 10px;
  }

  .error { color: #ff5252; }
  .success { color: #4caf50; }
  .loading { color: #ffb74d; }

  #infoSize {
    font-size: 0.8rem;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>

<h1>📸 Sube o capta tu plato de comida</h1>

<div class="buttons">
  <button id="uploadBtn">📁 Subir archivo</button>
  <button id="cameraBtn">📷 Usar cámara</button>
  <input type="file" id="fileInput" accept="image/*">
</div>

<div id="captureStage">
  <video id="video" autoplay playsinline muted></video>
  <img id="previewImg" style="display:none;">
  <div class="circle-overlay"></div>
</div>

<button id="confirmCaptureBtn">✅ Confirmar encuadre</button>

<div id="status"></div>

<div id="resultViewer">
  <img id="finalImg">
</div>

<div id="infoSize"></div>

<!-- TensorFlow.js + MobileNet -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

<script>
  const uploadBtn = document.getElementById('uploadBtn');
  const cameraBtn = document.getElementById('cameraBtn');
  const fileInput = document.getElementById('fileInput');
  const captureStage = document.getElementById('captureStage');
  const video = document.getElementById('video');
  const previewImg = document.getElementById('previewImg');
  const confirmCaptureBtn = document.getElementById('confirmCaptureBtn');
  const statusDiv = document.getElementById('status');
  const resultViewer = document.getElementById('resultViewer');
  const finalImg = document.getElementById('finalImg');
  const infoSize = document.getElementById('infoSize');

  let currentStream = null;
  let currentMode = null; // 'camera' | 'file'
  let model = null;

  // Palabras clave relacionadas con comida en las clases de MobileNet (ImageNet)
  const FOOD_KEYWORDS = [
	  'pizza', 'soup', 'plate', 'burger', 'sandwich', 'salad', 'pasta',
	  'bread', 'cake', 'dessert', 'meat', 'fruit', 'vegetable', 'rice',
	  'noodle', 'taco', 'burrito', 'sushi', 'stew', 'dish', 'food',
	  'guacamole', 'pretzel', 'bagel', 'pancake', 'waffle', 'hotdog',
	  'ice cream', 'trifle', 'custard', 'chocolate', 'egg', 'cheese',
	  'mashed potato', 'broccoli', 'cucumber', 'pepper', 'mushroom',
	  'pomegranate', 'banana', 'orange', 'lemon', 'strawberry', 'pineapple',
	  'bowl', 'cup', 'spoon', 'fork', 'plate rack', 'frying pan',
	  'wok', 'crock pot', 'potpie', 'consomme', 'meatloaf', 'carbonara',
	  'espresso', 'mixing bowl', 'strainer', 'ladle', 'cutting board'
	]

async function loadModel() {
  try {
    statusDiv.textContent = 'Cargando modelo de IA...';
    console.log('Iniciando carga de MobileNet...');
    model = await mobilenet.load();
    console.log('Modelo cargado correctamente:', model);
    statusDiv.textContent = 'Modelo listo. Puedes subir una foto.';
  } catch (err) {
    console.error('Error cargando el modelo:', err);
    statusDiv.textContent = 'Error al cargar el modelo de IA. Revisa la consola.';
  }
}

loadModel();

  // --- Botón subir archivo ---
  uploadBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    stopCamera();
    currentMode = 'file';

    const reader = new FileReader();
    reader.onload = (ev) => {
      previewImg.src = ev.target.result;
      previewImg.style.display = 'block';
      video.style.display = 'none';
      captureStage.style.display = 'block';
      confirmCaptureBtn.style.display = 'inline-block';
      resultViewer.style.display = 'none';
      statusDiv.textContent = '';
      infoSize.textContent = '';
    };
    reader.readAsDataURL(file);
  });

  // --- Botón cámara ---
  cameraBtn.addEventListener('click', async () => {
    try {
      currentMode = 'camera';
      previewImg.style.display = 'none';
      video.style.display = 'block';
      captureStage.style.display = 'block';
      resultViewer.style.display = 'none';
      statusDiv.textContent = '';
      infoSize.textContent = '';

      const constraints = {
        video: { facingMode: 'environment' } // cámara trasera en móvil
      };
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      confirmCaptureBtn.style.display = 'inline-block';
    } catch (err) {
      statusDiv.textContent = 'No se pudo acceder a la cámara: ' + err.message;
      statusDiv.className = 'error';
    }
  });

  function stopCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
      currentStream = null;
    }
  }

  // --- Confirmar encuadre: recorta al círculo (bounding box) ---
  confirmCaptureBtn.addEventListener('click', async () => {
    statusDiv.textContent = 'Analizando imagen...';
    statusDiv.className = 'loading';
    confirmCaptureBtn.disabled = true;

    const sourceEl = currentMode === 'camera' ? video : previewImg;
    const croppedCanvas = cropToCircleBoundingBox(sourceEl);

    // Validar si es comida
    const tempImg = new Image();
    tempImg.src = croppedCanvas.toDataURL('image/jpeg');
    tempImg.onload = async () => {
      const isFood = await checkIsFood(tempImg);

      if (!isFood) {
        statusDiv.textContent = '⚠️ La imagen no parece ser un plato de comida. Intenta de nuevo.';
        statusDiv.className = 'error';
        confirmCaptureBtn.disabled = false;
        return;
      }

      // Es comida: optimizar (resize + calidad 70%)
      const optimizedBlob = await optimizeImage(croppedCanvas, 800, 0.7);
      const optimizedUrl = URL.createObjectURL(optimizedBlob);

      finalImg.src = optimizedUrl;
      resultViewer.style.display = 'block';
      captureStage.style.display = 'none';
      confirmCaptureBtn.style.display = 'none';
      stopCamera();

      statusDiv.textContent = '✅ ¡Plato detectado correctamente!';
      statusDiv.className = 'success';

      const sizeKB = (optimizedBlob.size / 1024).toFixed(1);
      infoSize.textContent = `Tamaño optimizado: ${sizeKB} KB — listo para enviar`;

      confirmCaptureBtn.disabled = false;
    };
  });

  // --- Recorta al bounding box del círculo (80% centrado) ---
  function cropToCircleBoundingBox(sourceEl) {
    const isVideo = sourceEl.tagName === 'VIDEO';
    const naturalW = isVideo ? sourceEl.videoWidth : sourceEl.naturalWidth;
    const naturalH = isVideo ? sourceEl.videoHeight : sourceEl.naturalHeight;

    // El elemento se muestra con object-fit: cover en un contenedor cuadrado
    // Calculamos qué parte de la imagen original corresponde al cuadrado visible
    const minSide = Math.min(naturalW, naturalH);
    const offsetX = (naturalW - minSide) / 2;
    const offsetY = (naturalH - minSide) / 2;

    // El círculo ocupa 80% del contenedor cuadrado visible
    const circleSize = minSide * 0.8;
    const circleOffset = (minSide - circleSize) / 2;

    const canvas = document.createElement('canvas');
    canvas.width = circleSize;
    canvas.height = circleSize;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(
      sourceEl,
      offsetX + circleOffset, offsetY + circleOffset, circleSize, circleSize,
      0, 0, circleSize, circleSize
    );

    return canvas;
  }

  // --- Validar si es comida con MobileNet ---
	async function checkIsFood(imgElement) {
	  if (!model) {
		statusDiv.textContent = 'El modelo aún está cargando, espera un segundo...';
		return false;
	  }
	  const predictions = await model.classify(imgElement, 10);
	  console.log('Predicciones:', predictions);

	  const match = predictions.find(pred =>
		FOOD_KEYWORDS.some(keyword =>
		  pred.className.toLowerCase().includes(keyword)
		) && pred.probability > 0.05
	  );

	  console.log('¿Coincidencia encontrada?', match);

	  return !!match;
	}

  // --- Optimizar imagen: resize + calidad 70% ---
  function optimizeImage(canvasSource, maxSize = 800, quality = 0.7) {
    return new Promise((resolve) => {
      let { width, height } = canvasSource;

      if (width > height && width > maxSize) {
        height = Math.round((height * maxSize) / width);
        width = maxSize;
      } else if (height > maxSize) {
        width = Math.round((width * maxSize) / height);
        height = maxSize;
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(canvasSource, 0, 0, width, height);

      canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
    });
  }
</script>

</body>
</html>
