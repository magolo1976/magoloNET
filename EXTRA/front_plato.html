<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Validador de Comida</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#1a1d24;
    --accent:#4f9dff;
    --accent2:#2ecc71;
    --danger:#ff5c5c;
    --text:#e8eaed;
    --muted:#9aa0a6;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  h1{
    font-size:1.4rem;
    margin:8px 0 4px;
    text-align:center;
  }
  #modelStatus{
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:16px;
    text-align:center;
  }
  .buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
    width:100%;
    max-width:480px;
  }
  button{
    flex:1;
    min-width:140px;
    padding:14px 18px;
    font-size:1rem;
    border:none;
    border-radius:var(--radius);
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s ease, background .15s ease;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  button:active{transform:scale(.96);}
  button.primary{background:var(--accent); color:#fff;}
  button.danger{background:var(--danger); color:#fff;}
  button:disabled{opacity:.4; cursor:not-allowed;}

  #cameraSection, #resultSection{
    width:100%;
    max-width:480px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
  }

  .viewer{
    position:relative;
    width:100%;
    aspect-ratio: 3/4;
    max-height:70vh;
    background:#000;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  .viewer video, .viewer img{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .viewer .overlay{
    position:absolute;
    inset:0;
    border:3px dashed rgba(255,255,255,.4);
    border-radius:var(--radius);
    pointer-events:none;
    margin: 20px;
  }

  #captureBtn{
    width:70px;
    height:70px;
    border-radius:50%;
    background:#fff;
    border:4px solid var(--accent);
    padding:0;
    flex:none;
  }
  #captureBtn:active{transform:scale(.9);}

  #resultSection .viewer img{
    object-fit:contain;
    background:#111;
  }

  .info-box{
    width:100%;
    background:var(--panel);
    border-radius:var(--radius);
    padding:14px 18px;
    font-size:.9rem;
    line-height:1.5;
  }
  .info-box strong{color:var(--accent2);}
  .info-box.error{background:rgba(255,92,92,.15); color:var(--danger);}
  .info-box.error strong{color:var(--danger);}

  #diagPanel{
    width:100%;
    max-width:480px;
    margin-top:10px;
  }
  #diagPanel summary{
    cursor:pointer;
    color:var(--muted);
    font-size:.85rem;
    padding:8px 0;
  }
  #diagLog{
    background:#0a0b0e;
    border-radius:12px;
    padding:12px;
    font-family:monospace;
    font-size:.75rem;
    white-space:pre-wrap;
    max-height:300px;
    overflow-y:auto;
    color:#9fe8a0;
  }

  @media (min-width:700px){
    body{padding-top:40px;}
    h1{font-size:1.8rem;}
    .buttons, #cameraSection, #resultSection, #diagPanel{max-width:600px;}
    .viewer{aspect-ratio:4/3; max-height:520px;}
  }
</style>
</head>
<body>

<h1>🍽️ Validador de Comida</h1>
<div id="modelStatus">Cargando modelo de IA...</div>

<div class="buttons">
  <button id="uploadBtn" class="primary">📁 Subir archivo</button>
  <button id="cameraBtn" class="primary">📷 Hacer foto</button>
  <input type="file" id="fileInput" accept="image/*" hidden>
</div>

<div id="cameraSection">
  <div class="viewer">
    <video id="video" autoplay playsinline muted></video>
    <div class="overlay"></div>
  </div>
  <div class="buttons">
    <button id="captureBtn"></button>
    <button id="cancelCameraBtn" class="danger">✖ Cancelar</button>
  </div>
</div>

<div id="resultSection">
  <div class="viewer">
    <img id="result" hidden>
  </div>
  <div class="info-box" id="resultInfo">
    <div><strong id="decision">Sin imagen procesada</strong></div>
    <div>Tamaño: <span id="size">—</span></div>
  </div>
  <div class="buttons">
    <button id="retryBtn">🔄 Probar otra</button>
  </div>
</div>

<div id="errorBox" class="info-box error" style="display:none; max-width:480px; width:100%;"></div>

<details id="diagPanel">
  <summary>🔧 Diagnóstico</summary>
  <div id="diagLog">Esperando actividad...</div>
</details>

<canvas id="canvas" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);

  const modelStatus = $('modelStatus');
  const diagLog = $('diagLog');

  let model = null;
  let stream = null;
  let lastObjectUrl = null;

  const CONFIG = {
    foodThreshold: 0.18,
    emptyThreshold: 0.28,
    minFoodHits: 1
  };

  const POSITIVE_FOOD = [
    'plate','pizza','hotdog','cheeseburger','burrito','guacamole',
    'ice cream','trifle','french loaf','bagel','pretzel','meat loaf',
    'potpie','burrito','consomme','dough','cup','soup bowl',
    'espresso','banana','strawberry','orange','lemon','fig',
    'pineapple','custard apple','pomegranate','cucumber','artichoke',
    'bell pepper','cardoon','mushroom','Granny Smith','broccoli',
    'cauliflower','zucchini','spaghetti squash','acorn squash',
    'butternut squash','ear','carbonara','chocolate sauce','dough',
    'mashed potato','head cabbage','pizza,pizza pie','pretzel',
    'red wine','sandwich'
  ];

  function log(msg){
    const time = new Date().toLocaleTimeString();
    diagLog.textContent = `[${time}] ${msg}\n` + diagLog.textContent;
  }

  function showError(msg){
    const box = $('errorBox');
    box.textContent = '⚠️ ' + msg;
    box.style.display = 'block';
    log('ERROR: ' + msg);
  }

  function clearError(){
    $('errorBox').style.display = 'none';
  }

  function resetResult(){
    const result = $('result');
    result.hidden = true;
    result.removeAttribute('src');
    $('resultSection').style.display = 'none';
    $('decision').textContent = 'Sin imagen procesada';
    $('size').textContent = '—';
    clearError();
  }

  async function loadModel(){
    try{
      model = await mobilenet.load({version:2, alpha:1.0});
      modelStatus.textContent = '✅ Modelo de IA listo';
      log('MobileNet cargado correctamente.');
    }catch(err){
      modelStatus.textContent = '❌ No se pudo cargar el modelo de IA';
      showError('Error cargando el modelo de IA: ' + err.message);
    }
  }
  loadModel();

  // ---------- CÁMARA ----------
  async function openCamera(){
    clearError();
    resetResult();
    stopCamera();

    $('cameraSection').style.display = 'flex';
    $('resultSection').style.display = 'none';

    const constraintsList = [
      { video: { facingMode: { exact: 'environment' } }, audio:false },
      { video: { facingMode: 'environment' }, audio:false },
      { video: true, audio:false }
    ];

    let lastErr = null;
    for(const constraints of constraintsList){
      try{
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        $('video').srcObject = stream;
        log('Cámara iniciada con constraints: ' + JSON.stringify(constraints));
        return;
      }catch(err){
        lastErr = err;
        log('Fallo al pedir cámara con ' + JSON.stringify(constraints) + ' -> ' + err.message);
      }
    }
    showError('No se pudo acceder a la cámara: ' + (lastErr ? lastErr.message : 'desconocido'));
    $('cameraSection').style.display = 'none';
  }

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  $('cameraBtn').onclick = openCamera;

  $('cancelCameraBtn').onclick = () => {
    stopCamera();
    $('cameraSection').style.display = 'none';
  };

  $('captureBtn').onclick = () => {
    const video = $('video');
    const canvas = $('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

    stopCamera();
    $('cameraSection').style.display = 'none';

    const img = new Image();
    img.onload = () => validateAndProcess(img);
    img.src = dataUrl;
  };

  // ---------- SUBIDA DE ARCHIVO ----------
  $('uploadBtn').onclick = () => $('fileInput').click();

  $('fileInput').onchange = e => {
    const file = e.target.files[0];
    if(!file) return;

    resetResult();
    stopCamera();
    $('cameraSection').style.display = 'none';

    if(lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);

    const img = new Image();
    img.onload = () => validateAndProcess(img);
    img.onerror = () => showError('El archivo no es una imagen válida.');
    lastObjectUrl = URL.createObjectURL(file);
    img.src = lastObjectUrl;

    e.target.value = '';
  };

  $('retryBtn').onclick = () => {
    resetResult();
  };

  // ---------- VALIDACIÓN ----------
  async function validateAndProcess(img){
    clearError();

    if(!model){
      showError('El modelo de IA todavía no está listo. Espera unos segundos e inténtalo de nuevo.');
      return;
    }

    log(`Imagen cargada: ${img.naturalWidth}x${img.naturalHeight}`);

    try{
      const predictions = await model.classify(img, 10);
      log('PREDICCIONES CRUDAS: ' + JSON.stringify(predictions.map(p => `${p.className} (${(p.probability*100).toFixed(1)}%)`)));

      let foodHits = 0;
      let bestFoodProb = 0;
      let bestFoodName = '';

      predictions.forEach(p => {
        const nameLower = p.className.toLowerCase();
        const isFood = POSITIVE_FOOD.some(f => nameLower.includes(f));
        if(isFood && p.probability >= CONFIG.foodThreshold){
          foodHits++;
          if(p.probability > bestFoodProb){
            bestFoodProb = p.probability;
            bestFoodName = p.className;
          }
        }
      });

      const isValidFood = foodHits >= CONFIG.minFoodHits;

      $('result').src = img.src;
      $('result').hidden = false;
      $('resultSection').style.display = 'flex';

      $('size').textContent = `${img.naturalWidth} x ${img.naturalHeight}px`;

      if(isValidFood){
        $('decision').textContent = `✅ Comida detectada: ${bestFoodName} (${(bestFoodProb*100).toFixed(1)}%)`;
        $('decision').style.color = 'var(--accent2)';
        log(`VALIDADO como comida: ${bestFoodName} @ ${(bestFoodProb*100).toFixed(1)}%`);
      }else{
        $('decision').textContent = '❌ No se detectó comida en la imagen';
        $('decision').style.color = 'var(--danger)';
        log('RECHAZADO: no se detectó comida con suficiente confianza.');
      }

    }catch(err){
      showError('Error al procesar la imagen: ' + err.message);
    }
  }

})();
</script>

</body>
</html>
